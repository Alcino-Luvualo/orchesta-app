[package]
name = "orchestra-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "orchestra"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
anyhow = "1.0"
dirs = "5.0"
uuid = { version = "1.10", features = ["v4"] }
