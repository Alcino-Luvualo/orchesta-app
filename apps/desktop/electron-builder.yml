appId: com.orchestra.desktop
productName: Orchestra
electronVersion: 33.0.0
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: ../../target/release/orchestra-core
    to: bin/orchestra-core
  - from: ../../target/release/orchestra
    to: bin/orchestra
  # The daemon resolves these paths relative to process.resourcesPath in a
  # packaged app. Keep the canonical skill and the plugin tree as real
  # resources instead of relying on the package's working directory.
  - from: ../../skills/orchestra-canvas
    to: skills/orchestra-canvas
  - from: ../../.agents/plugins/plugins/orchestra
    to: plugins/orchestra
  - from: ../../.agents/plugins/marketplace.json
    to: plugins/marketplace.json
linux:
  maintainer: Alcino Luvualo <aluvualo@example.com>
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  category: Development
  synopsis: Orchestra Agent Workspace for Developers
  description: Infinite canvas desktop workspace powered by Electron, React and Rust core.
  icon: resources/icon.png
